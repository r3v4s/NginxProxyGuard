# Rate limiting zone definition
# Map to exclude static files from rate limiting (empty key = no rate limit)
# Only a GET or HEAD whose path ($npg_request_path, not the query string) ends in a static
# extension; an unsafe path is "" and stays limited. So does a path with ";" (Tomcat serves
# /login;.js as /login) or a script followed by more path (PHP runs /wp-login.php/x.css).
map "$request_method:$npg_request_path" $rate_limit_key_00000000_0000_0000_0000_0000000000f9 {
    "~*\.(?:php\d?|phtml|aspx?|ashx|asmx|svc|jsp|cgi|pl)/"  $binary_remote_addr;
    "~*^(?:GET|HEAD):[^;]*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm|pdf|zip|tar|gz|rar)$"  "";
    default  $binary_remote_addr;
}
# Rate limit exceptions and global trusted IPs bypass the zone (empty key = no
# rate limit). The chain is written whole even when both lists are empty: a
# running nginx refuses a reload that changes the key of a zone it has, so the
# key is always $rate_final_key_00000000_0000_0000_0000_0000000000f9.
geo $rate_wl_00000000_0000_0000_0000_0000000000f9 {
    default 0;
}
map $rate_wl_00000000_0000_0000_0000_0000000000f9 $rate_wl_key_00000000_0000_0000_0000_0000000000f9 {
    1       "";
    default $rate_limit_key_00000000_0000_0000_0000_0000000000f9;
}
map $trusted_ip_00000000_0000_0000_0000_0000000000f9 $rate_final_key_00000000_0000_0000_0000_0000000000f9 {
    1       "";
    default $rate_wl_key_00000000_0000_0000_0000_0000000000f9;
}
limit_req_zone $rate_final_key_00000000_0000_0000_0000_0000000000f9 zone=npg_rl_00000000_0000_0000_0000_0000000000f9:1m rate=1r/s;






# Global trusted IPs geo mapping (bypass all security). Written for a host
# with rate limiting even with no trusted IPs: its key chain reads it.
geo $trusted_ip_00000000_0000_0000_0000_0000000000f9 {
    default 0;

    127.0.0.4 1;

}





# Direct-forward upstream (keepalive connection pool to the backend)
# proxy_params.conf already sets the prerequisites: proxy_http_version 1.1 +
# empty Connection header. WebSocket hosts override Connection per-location
# with $connection_upgrade and simply don't benefit from the pool.
upstream npg_direct_00000000_0000_0000_0000_0000000000f9 {
    server 127.0.0.1:8081;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}



server {
    listen 8080;
    server_name trusted-rl.example.com;

    # Initialize tracking variables
    set $block_reason_var "-";
    set $bot_category_var "-";
    set $geo_blocked 0;
    set $is_search_bot 0;

    # NPM-compatible variables for custom config
    set $forward_scheme http;
    set $server "127.0.0.1";
    set $port 8081;

    # Shared host stanza: resolver, ACME/challenge skip vars, custom error pages
    include /etc/nginx/conf.d/includes/host_common.conf;



    # ACME HTTP-01 Challenge support (bypass all security checks)
    location /.well-known/acme-challenge/ {
        # Allow all access for certificate validation
        allow all;
        root /etc/nginx/acme-challenge;
        try_files $uri =404;
    }




    # WAF disabled for this host (override global modsecurity on)
    modsecurity off;



















    # Rate Limiting
    limit_req zone=npg_rl_00000000_0000_0000_0000_0000000000f9 burst=1 nodelay;
    limit_req_status 429;
    error_page 429 = @rate_limited;











    location / {


        proxy_pass http://npg_direct_00000000_0000_0000_0000_0000000000f9;
        # Direct-forward upstream is an upstream group name, so `proxy_redirect
        # default` can't derive the backend URL — rewrite backend Location/Refresh explicitly.
        proxy_redirect http://127.0.0.1:8081/ /;
        include /etc/nginx/includes/proxy_params.conf;
        
        
        

    }





    # Rate limited response handler
    location @rate_limited {
        set $block_reason_var "rate_limit";
        return 429;
    }





}



