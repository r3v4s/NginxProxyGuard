# Global trusted IPs geo mapping (filter subscription IP bypass)
geo $trusted_ip_00000000_0000_0000_0000_000000000a21 {
    default 0;

    192.0.2.10 1;

}

# Global trusted IPs and domains geo mapping (geo restriction, cloud provider,
# bot filter and rate limit bypass; bans, filter subscription IPs and the WAF
# give way to the IPs alone)
geo $npg_trusted_00000000_0000_0000_0000_000000000a21 {
    default 0;
    192.0.2.10 1;
    # dns: office.example.com
    include /etc/nginx/conf.d/includes/npg_dns/d25537a52b9e4659.geo;
}





# Direct-forward upstream (keepalive connection pool to the backend)
# proxy_params.conf already sets the prerequisites: proxy_http_version 1.1 +
# empty Connection header. WebSocket hosts override Connection per-location
# with $connection_upgrade and simply don't benefit from the pool.
upstream npg_direct_00000000_0000_0000_0000_000000000a21 {
    server 127.0.0.1:8080;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}



server {
    listen 80;
    listen [::]:80;
    server_name trusted-acl.example.com;

    # Initialize tracking variables
    set $block_reason_var "-";
    set $bot_category_var "-";
    set $geo_blocked 0;
    set $is_search_bot 0;

    # NPM-compatible variables for custom config
    set $forward_scheme http;
    set $server "127.0.0.1";
    set $port 8080;

    # Shared host stanza: resolver, ACME/challenge skip vars, custom error pages
    include /etc/nginx/conf.d/includes/host_common.conf;



    # ACME HTTP-01 Challenge support (bypass all security checks)
    location /.well-known/acme-challenge/ {
        # Allow all access for certificate validation
        allow all;
        root /etc/nginx/acme-challenge;
        try_files $uri =404;
    }




    # WAF disabled for this host (override global modsecurity on)
    modsecurity off;





    # Access List: partners
    # Note: Access list denials will have block_reason set to access_denied
    set $block_reason_var "access_denied";

    # Global trusted IPs - allow before deny (access phase, first-match wins)
    allow 192.0.2.10;


    allow 192.0.2.64/26;

    deny 192.0.2.70; # old office

    # dns(trusted): office.example.com
    include /etc/nginx/conf.d/includes/npg_dns/d25537a52b9e4659.allow;

    # dns: partner.example.com
    include /etc/nginx/conf.d/includes/npg_dns/41336b410ad2d365.allow;

    deny all;

























    location / {


        proxy_pass http://npg_direct_00000000_0000_0000_0000_000000000a21;
        # Direct-forward upstream is an upstream group name, so `proxy_redirect
        # default` can't derive the backend URL — rewrite backend Location/Refresh explicitly.
        proxy_redirect http://127.0.0.1:8080/ /;
        include /etc/nginx/includes/proxy_params.conf;
        
