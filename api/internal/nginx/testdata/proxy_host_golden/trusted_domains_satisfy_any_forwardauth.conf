# Global trusted IPs and domains geo mapping (geo restriction, cloud provider,
# bot filter and rate limit bypass; bans, filter subscription IPs and the WAF
# give way to the IPs alone)
geo $npg_trusted_00000000_0000_0000_0000_000000000a22 {
    default 0;
    # dns: office.example.com
    include /etc/nginx/conf.d/includes/npg_dns/d25537a52b9e4659.geo;
}





# Direct-forward upstream (keepalive connection pool to the backend)
# proxy_params.conf already sets the prerequisites: proxy_http_version 1.1 +
# empty Connection header. WebSocket hosts override Connection per-location
# with $connection_upgrade and simply don't benefit from the pool.
upstream npg_direct_00000000_0000_0000_0000_000000000a22 {
    server 127.0.0.1:8080;
    keepalive 32;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}



server {
    listen 80;
    listen [::]:80;
    server_name trusted-login.example.com;

    # Initialize tracking variables
    set $block_reason_var "-";
    set $bot_category_var "-";
    set $geo_blocked 0;
    set $is_search_bot 0;

    # NPM-compatible variables for custom config
    set $forward_scheme http;
    set $server "127.0.0.1";
    set $port 8080;

    # Shared host stanza: resolver, ACME/challenge skip vars, custom error pages
    include /etc/nginx/conf.d/includes/host_common.conf;



    # ACME HTTP-01 Challenge support (bypass all security checks)
    location /.well-known/acme-challenge/ {
        # Allow all access for certificate validation
        allow all;
        root /etc/nginx/acme-challenge;
        try_files $uri =404;
    }


    # Geo Restriction (whitelist) - Direct Block Mode (processed BEFORE WAF for performance)



    # Check geo restriction (skip for ACME challenge)
    set $geo_direct_block "";
    if ($geoip2_country_code !~ "^(KR)$") {
        set $geo_direct_block "Y";
        set $block_reason_var "geo_block";
    }
    # Global trusted IPs - bypass geo restriction
    if ($npg_trusted_00000000_0000_0000_0000_000000000a22 = 1) {
        set $geo_direct_block "";
        set $block_reason_var "-";
    }
    set $geo_direct_final "${geo_direct_block}${skip_security_for_acme}";
    if ($geo_direct_final = "Y0") {
        return 403;
    }






    # WAF disabled for this host (override global modsecurity on)
    modsecurity off;





    # Access List: office
    # Note: Access list denials will have block_reason set to access_denied
    set $block_reason_var "access_denied";
    satisfy any;

    allow 192.0.2.64/26;

    deny all;











    # Bot Filter - uses error_page 403 for custom error page
    # Priority Allow IPs bypass all bot filtering
    # Also bypass for ACME challenge
    set $priority_allow $skip_security_for_acme;



    # Global trusted IPs bypass bot filter
    if ($npg_trusted_00000000_0000_0000_0000_000000000a22 = 1) {
        set $priority_allow 1;
    }






    set $block_custom 0;
    if ($http_user_agent ~* (BadBot)) {
        set $block_custom 1;
    }
    # Block only if not in priority allow list
    set $custom_check "${priority_allow}${block_custom}";
    if ($custom_check = "01") {
        set $block_reason_var "bot_filter";
        set $bot_category_var "custom";
        return 403;
    }












# --- ForwardAuth (authelia) verify endpoint ---
    location = /internal/forwardauth/verify {
        internal;
        proxy_pass http://127.0.0.1:9091/api/authz/auth-request;
        proxy_set_header X-Original-Method $request_method;
        # Authelia derives the protected URL's scheme from X-Original-URL (it ignores
        # X-Forwarded-Proto at the auth-request endpoint) and rejects an http scheme
        # because session cookies are Secure. Pin https for SSL hosts so the verify
        # subrequest is accepted even when it runs in the HTTP/80 block or behind a
        # TLS-terminating proxy that reaches NPG over http. (#180)
        proxy_set_header X-Original-URL $scheme://$host$request_uri;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5000ms;
        modsecurity off;
    }










    location / {

# --- ForwardAuth (authelia) gate ---
        auth_request /internal/forwardauth/verify;
        auth_request_set $fa_user $upstream_http_remote_user;
        auth_request_set $fa_groups $upstream_http_remote_groups;
        auth_request_set $fa_name $upstream_http_remote_name;
        auth_request_set $fa_email $upstream_http_remote_email;
        proxy_set_header Remote-User $fa_user;
        proxy_set_header Remote-Groups $fa_groups;
        proxy_set_header Remote-Name $fa_name;
        proxy_set_header Remote-Email $fa_email;
        auth_request_set $fa_redirect $upstream_http_location;
        error_page 401 =302 $fa_redirect;

        proxy_pass http://npg_direct_00000000_0000_0000_0000_000000000a22;
        # Direct-forward upstream is an upstream group name, so `proxy_redirect
        # default` can't derive the backend URL — rewrite backend Location/Refresh explicitly.
        proxy_redirect http://127.0.0.1:8080/ /;
        include /etc/nginx/includes/proxy_params.conf;
        
