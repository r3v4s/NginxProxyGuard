# nginx-guard generated config
# Proxy Host ID: 00000000-0000-0000-0000-000000000a22
# Domain(s): trusted-login.example.com
# WAF: disabled
# HTTP/3: disabled
# Access List: office
# Geo Restriction: whitelist (1 countries)
# Rate Limit: none
# Upstream: none
