# Rate limiting zone definition
# Map to exclude static files from rate limiting (empty key = no rate limit)
# Only a GET or HEAD whose path ($npg_request_path, not the query string) ends in a static
# extension; an unsafe path is "" and stays limited. So does a path with ";" (Tomcat serves
# /login;.js as /login) or a script followed by more path (PHP runs /wp-login.php/x.css).
map "$request_method:$npg_request_path" $rate_limit_key_00000000_0000_0000_0000_000000000a20 {
    "~*\.(?:php\d?|phtml|aspx?|ashx|asmx|svc|jsp|cgi|pl)/"  $binary_remote_addr;
    "~*^(?:GET|HEAD):[^;]*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|mp4|webm|pdf|zip|tar|gz|rar)$"  "";
    default  $binary_remote_addr;
}
# Rate limit exceptions and global trusted IPs bypass the zone (empty key = no
# rate limit). The chain is written whole even when both lists are empty: a
# running nginx refuses a reload that changes the key of a zone it has, so the
# key is always $rate_final_key_00000000_0000_0000_0000_000000000a20.
geo $rate_wl_00000000_0000_0000_0000_000000000a20 {
    default 0;
}
map $rate_wl_00000000_0000_0000_0000_000000000a20 $rate_wl_key_00000000_0000_0000_0000_000000000a20 {
    1       "";
    default $rate_limit_key_00000000_0000_0000_0000_000000000a20;
}
map $npg_trusted_00000000_0000_0000_0000_000000000a20 $rate_final_key_00000000_0000_0000_0000_000000000a20 {
    1       "";
    default $rate_wl_key_00000000_0000_0000_0000_000000000a20;
}
limit_req_zone $rate_final_key_00000000_0000_0000_0000_000000000a20 zone=npg_rl_00000000_0000_0000_0000_000000000a20:10m rate=10r/s;




# Banned IPs geo mapping for trusted-domains.example.com
# Values: 1 = manual ban, 0 = trusted (override)
# Filter subscription IPs are matched by the shared $filter_sub_ip geo
# (conf.d/filter_sub_ips_geo.conf) - one radix tree for all hosts.
geo $banned_ip_00000000_0000_0000_0000_000000000a20 {
    default 0;

    192.0.2.99 1; # test ban


}



# Global trusted IPs geo mapping (filter subscription IP bypass). Written
# for a host with rate limiting even with no trusted IPs: Advanced Config may
# read it.
geo $trusted_ip_00000000_0000_0000_0000_000000000a20 {
    default 0;

}

# Global trusted IPs and domains geo mapping (geo restriction, cloud provider,
# bot filter and rate limit bypass; bans, filter subscription IPs and the WAF
# give way to the IPs alone). Written for a host with rate limiting even with
# no trusted IPs or domains: its key chain reads it.
geo $npg_trusted_00000000_0000_0000_0000_000000000a20 {
    default 0;
    # dns: office.example.com
    include /etc/nginx/conf.d/includes/npg_dns/d25537a52b9e4659.geo;
    # dns: partner.example.com
    include /etc/nginx/conf.d/includes/npg_dns/8cc579924a629e95.geo;
}



# Blocked Cloud Provider IPs geo mapping for trusted-domains.example.com
