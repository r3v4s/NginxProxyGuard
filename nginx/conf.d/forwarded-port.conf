# $npg_forwarded_port, the X-Forwarded-Port that includes/proxy_params.conf
# sends upstream: the port the client connected to. That is the port in its
# Host header, or the scheme's default when the header names none. nginx's
# $server_port is the port nginx listens on; behind a router that forwards 443
# to another port it is not the client's, and an app that builds links from
# the header points them at a port the client cannot reach. A request without
# a Host header keeps the listen port.
#
# The entrypoint installs this file on every start, with includes/: every
# nginx.conf includes conf.d/*.conf at the http level.

map $http_host $npg_host_port {
    ''                                   '';
    '~^(?:\[[^\]]*\]|[^:]*):([0-9]+)$'   $1;
    default                              '-';
}

map "$scheme:$npg_host_port" $npg_forwarded_port {
    '~^https?:([0-9]+)$'   $1;
    'https:-'              443;
    'http:-'               80;
    default                $server_port;
}
